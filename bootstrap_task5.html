<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form with Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .invalid-feedback {
            display: block;
            padding-left: 15px;
        }
        .form-row {
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="mb-4">Contact Form</h2>
            <form id="contactForm" novalidate>
                <!-- First Row -->
                <div class="row form-row">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">First Name *</label>
                        <input type="text" class="form-control" id="firstName" required>
                        <div class="invalid-feedback">Please enter your first name</div>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Last Name *</label>
                        <input type="text" class="form-control" id="lastName" required>
                        <div class="invalid-feedback">Please enter your last name</div>
                    </div>
                </div>

                <!-- Second Row -->
                <div class="row form-row">
                    <div class="col-md-6">
                        <label for="email" class="form-label">E-Mail *</label>
                        <input type="email" class="form-control" id="email" required>
                        <div class="invalid-feedback">Please enter a valid email</div>
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label">Phone #</label>
                        <input type="tel" class="form-control" id="phone">
                    </div>
                </div>

                <!-- Address -->
                <div class="row form-row">
                    <div class="col-12">
                        <label for="address" class="form-label">Address *</label>
                        <input type="text" class="form-control" id="address" required>
                        <div class="invalid-feedback">Please enter your address</div>
                    </div>
                </div>

                <!-- City/State -->
                <div class="row form-row">
                    <div class="col-md-6">
                        <label for="city" class="form-label">City *</label>
                        <input type="text" class="form-control" id="city" required>
                        <div class="invalid-feedback">Please enter your city</div>
                    </div>
                    <div class="col-md-6">
                        <label for="state" class="form-label">State *</label>
                        <select class="form-select" id="state" required>
                            <option value="">Choose...</option>
                            <option value="CA">California</option>
                            <option value="NY">New York</option>
                            <option value="TX">Texas</option>
                        </select>
                        <div class="invalid-feedback">Please select a state</div>
                    </div>
                </div>

                <!-- Hosting Question -->
                <div class="row form-row">
                    <div class="col-12">
                        <label class="form-label">Do you have hosting? *</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="hosting" id="hostingYes" required>
                            <label class="form-check-label" for="hostingYes">Yes</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="hosting" id="hostingNo" required>
                            <label class="form-check-label" for="hostingNo">No</label>
                        </div>
                        <div class="invalid-feedback">Please select an option</div>
                    </div>
                </div>

                <!-- Project Description -->
                <div class="row form-row">
                    <div class="col-12">
                        <label for="projectDesc" class="form-label">Project Description *</label>
                        <textarea class="form-control" id="projectDesc" rows="4" required></textarea>
                        <div class="invalid-feedback">Please describe your project</div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="row mt-4">
                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-primary btn-lg">Submit Form</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict'
            
            const form = document.getElementById('contactForm')
            
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }

                form.classList.add('was-validated')
            }, false)
        })()
    </script>
</body>
</html>
