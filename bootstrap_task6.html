<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form with Validation</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .form-group label {
      font-weight: bold;
    }
    .is-invalid {
      border-color: red;
    }
    .form-control + .invalid-feedback {
      display: block;
      color: red;
    }
    .input-group .input-group-text {
      color: red;
      border-color: red;
    }
    .btn-submit {
      background-color: red;
      color: white;
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2>Bootstrap Form with Validation</h2>
    <form id="customForm" novalidate>
      <!-- Name Field -->
      <div class="form-group">
        <label for="name">Name</label>
        <div class="input-group">
          <input type="text" class="form-control is-invalid" id="name" placeholder="Name" required>
          <div class="input-group-append">
            <span class="input-group-text">&#9432;</span>
          </div>
          <div class="invalid-feedback">Name is required</div>
        </div>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-group">
          <input type="email" class="form-control is-invalid" id="email" placeholder="Email" required>
          <div class="input-group-append">
            <span class="input-group-text">&#9432;</span>
          </div>
          <div class="invalid-feedback">Email is required</div>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-group">
          <input type="password" class="form-control is-invalid" id="password" placeholder="Password" required>
          <div class="input-group-append">
            <span class="input-group-text">&#9432;</span>
          </div>
          <div class="invalid-feedback">Password is required</div>
        </div>
      </div>

      <!-- Hobbies Dropdown -->
      <div class="form-group">
        <label for="hobbies">Hobbies</label>
        <select class="form-control" id="hobbies">
          <option>Select your hobby</option>
          <option>Reading</option>
          <option>Traveling</option>
          <option>Gaming</option>
        </select>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-submit">Submit</button>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
